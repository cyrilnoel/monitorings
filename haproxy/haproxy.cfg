global
  log stdout format raw local0
  maxconn 4096

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client  30s
  timeout server  30s

# DNS resolver Docker
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry   1s
  hold other      10s
  hold refused    10s
  hold nx         10s
  hold timeout    10s
  hold valid      10s

# Frontend API (exposé en 5000)
frontend fe_api
  bind *:5000
  default_backend api_back

backend api_back
  balance roundrobin
  option httpchk GET /health
  http-check expect status 200
  default-server inter 2s fall 2 rise 2
  # 3 serveurs max (si tu scales à 3). Ajuste si tu scales plus.
  server-template api 3 api:5000 check resolvers docker init-addr libc,none

# Stats + Prometheus exporter (exposé en 8404)
frontend fe_stats
  bind *:8404
  mode http
  stats enable
  stats uri /
  stats refresh 10s
  stats show-node
  http-request use-service prometheus-exporter if { path /metrics }
