global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  # API: DNS SD => 1 target par replica quand tu fais --scale api=3
  - job_name: "api"
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["api"]
        type: "A"
        port: 5000

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "haproxy"
    metrics_path: /metrics
    static_configs:
      - targets: ["haproxy:8404"]
